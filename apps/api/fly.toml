app = "servisapp-api"
primary_region = "fra"   # Supabase EU bölgesine komşu

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node dist/migrate-release.js"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  LOG_LEVEL = "info"
  # Fly Proxy bu başlığı her istekte kendisi yazar ve istemciden geleni ezer.
  # Olmadan `request.ip` herkes için vekilin adresi olur: IP başına kurulmuş
  # sınırlar küresele döner ve tek bir bozuk istemci sahadaki herkesi 429'a
  # kilitleyebilir. Uygulama portu yalnız vekil üzerinden erişilebilir.
  CLIENT_IP_HEADER = "fly-client-ip"

[processes]
  app = "node dist/server.js"
  worker = "node dist/worker.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # sabah/akşam seferlerinde soğuk başlangıç istemiyoruz
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health/ready"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512mb"               # ölç, sonra büyüt (SPEC §15)

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"

# Worker HTTP almaz; deploy sonrası `fly scale count worker=1` (kapanmasın).

